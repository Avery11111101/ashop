# ashop 設定

languages:
  default: zh_tw
  fallback: en_us
  # 語言代碼: 顯示名稱（語系檔：plugins/ashop/locales/<代碼>.properties）
  # 可自由新增插件未內建的語言，建立對應 .properties 即可
  locales:
    zh_tw: 繁體中文
    en_us: English
    # ja_jp: 日本語
    # ko_kr: 한국어

economy:
  enabled: true
  currency-symbol: "$"

# 系統商店（玩家只能跟系統買賣，不能上架）
system-shop:
  enabled: true
  player-listings: false    # false = 禁止玩家上架
  sell-to-system: true      # 允許 /shop sell 賣給系統
  sell-ratio: 0.667          # 收購價 = 購買價 × 2/3（閃長岩 9→6、重錘 180000→120000）
  require-listed-item: true # 只能賣 shop/ 設定中已啟用的物品

# Discord 交易紀錄推播
discord-webhook:
  enabled: false
  url: "YOUR_WEBHOOK_URL_HERE"

# Discord 線上商店預覽與購買面板 (Discord Online Store & Preview/Purchase)
discord:
  enabled: true
  bot-token: ""                      # 獨立 Bot Token（若留空且安裝 DiscordSRV 則自動使用 DiscordSRV Bot）
  require-discordsrv-link: true      # 購買時是否強制要求 DiscordSRV 帳號繫結
  command-name: "商店"               # 斜線指令名稱 (例如: /商店, /shop)
  guild-ids: []                      # 限制發布的伺服器 Guild ID（留空代表全伺服器通用）

# Discord 定期營運報表 (每日/每週/每月)
# 說明：
# - 若使用 Bot 發送至頻道 (channel-id)，會附帶「永久按鈕」與「永久下拉選單」供玩家切換詳細數據與排名；
# - 若使用 Webhook 發送 (webhook-url)，則發送純 Embed 報表訊息。
# - 時區備註 (timezone)：預設 system (使用伺服器主機系統時區)。若主機位於國外 VPS，可手動設定為 "Asia/Taipei"、"UTC" 或指定時區。
discord-report:
  enabled: true
  timezone: "system"                # 時區設定 (system = 系統預設, 或手動指定 "Asia/Taipei" / "UTC" 等)
  channel-id: ""                    # 接收報表的 Discord 頻道 ID (若使用 Bot 發送頻道)
  webhook-url: ""                   # 可選：若填寫，亦可透過指定 Webhook 發送純 Embed 報表
  scheduled:
    daily:
      enabled: true
      time: "00:00"                 # 每天 00:00 發送每日報表 (依指定時區)
    weekly:
      enabled: true
      day-of-week: "MONDAY"         # 每週一 00:00 發送每週報表 (依指定時區)
      time: "00:00"
    monthly:
      enabled: true
      day-of-month: 1               # 每月 1 號 00:00 發送每月報表 (依指定時區)
      time: "00:00"

default-prices:
  enabled: true
  mode: catalog          # catalog=讀 shop/ 分類設定（高效能）| listings=逐項上架（舊模式）
  base-price: 10.0

# 商店完全由 shop/ 資料夾定義（不再寫死分類）
shop:
  folder: shop
  extract-template: true   # 首次釋出 shop/_template/items.yml 範例
  auto-seed-on-first-run: true   # shop/ 尚無分類時，自動建立預設全物品巢狀商店
  survival-only-defaults: true   # 預設商店僅含生存可取得物品（排除指令方塊、光源方塊、生怪蛋等）
  pricing:
    reference-price: 10.0
    # 伺服器匯率：實際價格 = 基準價 × multiply + add（改 config 後 /shop reload 即生效）
    exchange:
      multiply: 1.0    # 倍率，例如 2.0 = 全部基準價 ×2
      add: 0.0         # 固定加值，例如 30 = 每項再加 30
    backfill-missing-prices: true
    min-price: 0.5
    max-price: 100000.0
    round-to: 0.5

performance:
  save-delay-ticks: 40   # 存檔延遲（40 tick = 2 秒），避免每次交易卡頓

# 動態定價：越買越貴、越賣越便宜、物以稀為貴
dynamic-pricing:
  enabled: true
  base-price: 10.0

  # 每被「購買」1 次，價格上漲基準價的 X%（%）
  per-buy-increase: 2.0

  # 每「賣給系統」1 次，價格下跌基準價的 X%（%）；建議與 per-buy-increase 相同（1:1 恢復）
  per-sell-decrease: 2.0

  # 物以稀為貴：市場庫存每少 1 件（相對 reference-stock），額外上漲 X%（%）
  per-stock-shortage-increase: 3.0

  # 參考庫存量（用於計算稀缺度，庫存低於此值時漲價）
  reference-stock: 5

  # 價格上下限（基準價倍率）
  min-multiplier: 0.2
  max-multiplier: 5.0

  # 套用範圍
  system-shop: true
  player-listings: false

  # /shop sell 不帶價格時，自動使用建議動態價
  auto-suggest-price: true

  # 基準值物價自動回歸機制（物價偏離基準價時，按時間週期自動向基準價靠攏）
  auto-reversion:
    enabled: false                # 預設關閉（true = 啟用每小時自動回歸基準價）
    interval-minutes: 60          # 調整週期（分鐘，預設 60 分鐘 = 1 小時）
    increase-rate-percent: 1.0    # 漲幅：當物價低於基準價時，每小時回調上漲 % 數
    decrease-rate-percent: 1.0    # 跌幅：當物價高於基準價時，每小時回調下跌 % 數

gui:
  rows: 6
  items-per-page: 45
  max-buy-amount: 2304   # 單次購買上限（自訂數量）

search:
  min-length: 1
  max-results: 100

storage:
  listings-file: listings.yml
  market-file: market-data.yml

# 基岩版 (Bedrock / Geyser / Floodgate) 限制設定
bedrock:
  block-gui: false   # false = 預設允許基岩版玩家開啟 GUI 面板（如欲防範觸控問題可改為 true 禁止並引導至 Discord）


