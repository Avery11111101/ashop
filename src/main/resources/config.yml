# ashop 設定

languages:
  default: zh_tw
  fallback: en_us
  # 語言代碼: 顯示名稱（語系檔：plugins/ashop/locales/<代碼>.properties）
  # 可自由新增插件未內建的語言，建立對應 .properties 即可
  locales:
    zh_tw: 繁體中文
    en_us: English
    # ja_jp: 日本語
    # ko_kr: 한국어

economy:
  enabled: true
  currency-symbol: "$"

# 系統商店（玩家只能跟系統買賣，不能上架）
system-shop:
  enabled: true
  player-listings: false    # false = 禁止玩家上架
  sell-to-system: true      # 允許 /shop sell 賣給系統
  sell-ratio: 0.5           # 收購價 = 動態購買價 × 比例
  require-listed-item: true # 只能賣 shop/ 設定中已啟用的物品

default-prices:
  enabled: true
  mode: catalog          # catalog=讀 shop/ 分類設定（高效能）| listings=逐項上架（舊模式）
  base-price: 10.0

# 商店完全由 shop/ 資料夾定義（不再寫死分類）
shop:
  folder: shop
  extract-template: true   # 首次釋出 shop/_template/items.yml 範例
  pricing:
    reference-price: 10.0
    # 伺服器匯率：實際價格 = 基準價 × multiply + add（改 config 後 /shop reload 即生效）
    exchange:
      multiply: 1.0    # 倍率，例如 2.0 = 全部基準價 ×2
      add: 0.0         # 固定加值，例如 30 = 每項再加 30
    backfill-missing-prices: true
    min-price: 0.5
    max-price: 100000.0
    round-to: 0.5

performance:
  save-delay-ticks: 40   # 存檔延遲（40 tick = 2 秒），避免每次交易卡頓

# 動態定價：越買越貴、越賣越便宜、物以稀為貴
dynamic-pricing:
  enabled: true
  base-price: 10.0

  # 每被「購買」1 次，價格上漲基準價的 X%（%）
  per-buy-increase: 2.0

  # 每被「上架」1 次，價格下跌基準價的 X%（%）
  per-sell-decrease: 1.5

  # 物以稀為貴：市場庫存每少 1 件（相對 reference-stock），額外上漲 X%（%）
  per-stock-shortage-increase: 3.0

  # 參考庫存量（用於計算稀缺度，庫存低於此值時漲價）
  reference-stock: 5

  # 價格上下限（基準價倍率）
  min-multiplier: 0.2
  max-multiplier: 5.0

  # 套用範圍
  system-shop: true
  player-listings: false

  # /shop sell 不帶價格時，自動使用建議動態價
  auto-suggest-price: true

gui:
  rows: 6
  items-per-page: 45
  max-buy-amount: 2304   # 單次購買上限（自訂數量）

search:
  min-length: 1
  max-results: 100

storage:
  listings-file: listings.yml
  market-file: market-data.yml
