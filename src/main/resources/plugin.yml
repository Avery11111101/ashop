name: ashop
version: '${version}'
main: com.avery.shop.ShopPlugin
api-version: '26.2'
description: ashop - 動態經濟商店：越買越貴、越賣越便宜、物以稀為貴
author: Avery
softdepend:
  - Vault
  - DiscordSRV

commands:
  shop:
    description: 開啟商店介面
    usage: /shop|/ashop [help|search|sell|price|reload|reset]
    aliases: [ashop, 商店, vs]
  lang:
    description: 切換語言
    usage: /lang [語言代碼|list]
    aliases: [language, 語言]

permissions:
  shop.use:
    description: 使用商店
    default: true
  shop.sell:
    description: 賣物品給系統
    default: true
  shop.admin:
    description: 管理商店
    default: op
  shop.lang:
    description: 切換語言
    default: true
